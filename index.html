const focusSvgs=['<svg viewBox="0 0 42 50" aria-hidden="true" fill="currentColor"><path d="M20 25C6 22 7 10 9 6l6 7 5-12 5 12 6-7c3 9-2 18-11 19Zm-2 3C9 21 4 25 4 25c0 13 6 17 14 18Zm4 0c9-7 14-3 14-3 0 13-6 17-14 18Z"/><path d="M19 22h3v23h-3z"/></svg>', '<svg viewBox="0 0 42 50" aria-hidden="true" fill="currentColor"><path d="M7 3h2v12h2V3h2v12h2V3h2v14c0 4-3 6-4 6v22H9V23c-3-1-4-3-4-6V3Zm24 0c-7 10-8 20-5 24h4v18h4V3Z"/></svg>', '<svg viewBox="0 0 42 50" aria-hidden="true" fill="currentColor"><ellipse cx="20" cy="10" rx="7" ry="9"/><path d="M12 23q8-4 16 0l6 22H24l-1-9h-6l-1 9H6Z"/></svg>', '<svg viewBox="0 0 42 50" aria-hidden="true" fill="currentColor"><ellipse cx="11" cy="10" rx="5" ry="7"/><ellipse cx="29" cy="10" rx="5" ry="7"/><path d="M3 23q8-7 16 0l-1 22h-5V30h-3v15H4Zm18 0q8-7 16 0l-1 22h-5V30h-3v15h-6Z"/></svg>', '<svg viewBox="0 0 42 50" aria-hidden="true" fill="currentColor"><circle cx="7" cy="8" r="4"/><circle cx="33" cy="8" r="4"/><circle cx="20" cy="23" r="4"/><path d="M3 17q4-5 8 0l3 15-4 1-1 12H5L4 31H1Zm26 0q4-5 8 0l3 14h-3l-2 14h-4l-1-12-4-1ZM15 31q5-4 10 0l3 10-4 1-1 5h-6l-1-5-4-1Z"/></svg>', '<svg viewBox="0 0 42 50" aria-hidden="true" fill="currentColor"><path d="M2 44 13 8l8 21L28 2l12 42Z"/></svg>'];const bounds=[[.24,.26],[.47,.54],[1,1.4],[1.4,2.2],[2.1,5.3],[5.1,Infinity]];let ringReady=false,ringAuto=false,ringTimer;function updateIcons(d){let hits=0;bounds.forEach((b,i)=>{const hit=d>=b[0]&&d<=b[1];document.getElementById("focusIcon"+i).classList.toggle("active",hit);document.getElementById("focusIcon"+i).setAttribute("aria-label",["花卉","餐具","单人","双人","多人","山峰"][i]+(hit?"：适用":""));if(hit)hits++});document.getElementById("focusTip").textContent=hits>1?"区间重叠 · 两个图标均适用":hits?"对焦环 · 中央刻度为当前档位":"当前距离不在图示参考区间"}function centerRing(index){const el=document.getElementById('focusIcon'+index),rail=document.querySelector('.focus-options');if(!el||!rail)return;ringAuto=true;clearTimeout(ringTimer);rail.scrollTo({left:el.offsetLeft-rail.clientWidth/2+el.offsetWidth/2,behavior:ringReady?'smooth':'instant'});ringTimer=setTimeout(()=>ringAuto=false,700);ringReady=true}const objects=[{name:'花卉',d:.25,x:28,y:56,ref:0},{name:'餐桌',d:.51,x:52,y:72,ref:1},{name:'人物',d:1.24,x:74,y:47,ref:2},{name:'窗外远景',d:8.6,x:39,y:27,ref:5}],ranges=[['花卉 / 近物','0.24–0.26'],['餐桌 / 静物','0.47–0.54'],['单人肖像','1.0–1.4'],['双人合影','1.4–2.2'],['多人合影','2.1–5.3'],['远景 / 风景','5.1–∞']];let chosen=2,timer,toastTimer;const $=id=>document.getElementById(id),records=[];function select(i){chosen=i;const o=objects[i];document.querySelectorAll('.target').forEach((b,j)=>b.classList.toggle('selected',i===j));positionScene();$('state').textContent='模拟扫描中…';updateIcons(NaN);$('distance').textContent='—';clearTimeout(timer);timer=setTimeout(()=>{$('distance').textContent=o.d.toFixed(2);updateIcons(o.d);centerRing(o.ref);$('state').textContent='模拟测量 · 已选中';$('subject').textContent=o.name+' · 手机至目标的模拟距离';$('chip').textContent=ranges[o.ref].join(' ')+' m'},250)}document.querySelectorAll('.target').forEach(b=>b.onclick=()=>select(+b.dataset.i));$('references').onclick=()=>{$('sheetTitle').textContent='距离参考';$('content').innerHTML=ranges.map((r,i)=>`<div class="ref ${i===objects[chosen].ref?'hit':''}"><span class="ref-icon">${focusSvgs[i]}${r[0]}</span><strong>${r[1]} <small>m</small></strong></div>`).join('')+'<p>数值来自你提供的图片，场景名称按图标整理。参考范围可重叠，不代表硬件量程。</p>';$('sheet').showModal()};$('capture').onclick=()=>{const o=objects[chosen];records.unshift({name:o.name,d:o.d,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});$('toast').textContent='已记录 '+o.name+' · '+o.d.toFixed(2)+' m（模拟）';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2200)};$('records').onclick=()=>{$('sheetTitle').textContent='模拟测距记录';$('content').replaceChildren();if(!records.length){$('content').textContent='点击底部中间按钮，记录当前模拟距离。'}else records.forEach(r=>{const row=document.createElement('div');row.className='history';row.textContent=r.name+' · '+r.d.toFixed(2)+' m';const t=document.createElement('small');t.textContent=r.time;row.append(t);$('content').append(row)});const note=document.createElement('p');note.textContent='记录仅用于本次交互演示，刷新后清空。';$('content').append(note);$('sheet').showModal()};$('close').onclick=()=>$('sheet').close();const rail=document.querySelector('.focus-options');[...rail.children].reverse().forEach(el=>rail.append(el));rail.addEventListener('scroll',()=>{if(ringAuto)return;clearTimeout(ringTimer);ringTimer=setTimeout(()=>{const c=rail.scrollLeft+rail.clientWidth/2;let best=[...rail.children].reduce((a,b)=>Math.abs(a.offsetLeft+a.offsetWidth/2-c)<Math.abs(b.offsetLeft+b.offsetWidth/2-c)?a:b);const index=Number(best.id.replace('focusIcon',''));document.querySelectorAll('.focus-option').forEach(el=>el.classList.toggle('active',el===best));$('focusTip').textContent='手动对照 · '+ranges[index][0]+' '+ranges[index][1]+' m';},100)});rail.addEventListener('pointerdown',()=>{ringAuto=false;clearTimeout(ringTimer)});document.querySelectorAll('.focus-option').forEach((el)=>{el.setAttribute('role','button');el.tabIndex=0;const go=()=>{centerRing(Number(el.id.replace('focusIcon','')));document.querySelectorAll('.focus-option').forEach(x=>x.classList.toggle('active',x===el));$('focusTip').textContent='手动对照 · '+ranges[Number(el.id.replace('focusIcon',''))][0]};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});let drag=null,moved=false;rail.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag={x:e.clientX,left:rail.scrollLeft};moved=false;rail.style.scrollSnapType='none'});window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4)moved=true;rail.scrollLeft=drag.left-dx});window.addEventListener('pointerup',()=>{if(!drag)return;drag=null;rail.style.scrollSnapType='x mandatory'});rail.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();moved=false}},true);rail.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();ringAuto=false;rail.scrollLeft+=e.deltaY}},{passive:false});function positionScene(){const main=document.querySelector('main'),scene=document.querySelector('.scene'),rect=scene.getBoundingClientRect(),base=main.getBoundingClientRect();function place(el,o){el.style.left=(rect.left-base.left+rect.width*o.x/100)+'px';el.style.top=(rect.top-base.top+rect.height*o.y/100)+'px'}document.querySelectorAll('.target').forEach((el,i)=>place(el,objects[i]));place($('focus'),objects[chosen])}window.addEventListener('resize',()=>{positionScene();centerRing(objects[chosen].ref)});select(2);
</script></html>
